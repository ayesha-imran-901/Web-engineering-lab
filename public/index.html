<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Engineering Lab</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header>
      <h1 id="greeting"></h1>
      <nav>
        <ul>
          <li><a href="#schedule" aria-current="location">Office Hours</a></li>
          <li><a href="#feedback">Send Feedback</a></li>
        </ul>
      </nav>
    </header>

    <main id="main-content">
      <section id="schedule">
        <h2>Office Hours</h2>
        <table>
          <caption>Weekly Office Hours</caption>
          <thead>
            <tr>
              <th scope="col">Day</th>
              <th scope="col">Time</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row">Monday</th>
              <td>
                <time datetime="10:00">10:00</time>
                <time datetime="11:00">11:00</time>
              </td>
            </tr>
          </tbody>
        </table>
        <figure>
          <svg role="img" aria-labelledby="pin-title" width="24" height="24">
            <title id="pin-title">Location pin</title>
            ...
          </svg>
          <figcaption>All office hours are held in Room 214.</figcaption>
        </figure>
      </section>
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="#0b3d91" />
      </svg>


      <section id="feedback">
        <h2>Send Feedback</h2>
        <form>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required />
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required aria-describedby="email-hint" />
            <span id="email-hint">We will only use this to reply to you.</span>

          <fieldset>
            <legend>Topic</legend>
            <label>
              <input type="radio" name="topic" value="leave">
              Leave Request
            </label>
            <label>
              <input type="radio" name="topic" value="meeting">
              Meeting Request
            </label>
          </fieldset>
          <label for="message">Message</label>
          <textarea id="message" name="message"></textarea>
          <button type="submit">Submit</button>
        </form>
        </section>
    </main>

    <footer>
      <address>Contact your instructor for help</address>
    </footer>


    <script src="script.js"></script>
  </body>
</html>
